<!doctype html>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font:600 14px 'Segoe UI',system-ui,sans-serif}
#p{display:flex;align-items:center;gap:10px;min-height:40px;margin:4px;padding:6px 18px;border-radius:22px;background:#fff;color:#1f1f1f;box-shadow:0 4px 16px rgba(0,0,0,.18);border:1px solid #eee}
#d{flex:none;width:10px;height:10px;border-radius:50%;background:#FFC800}small{display:block;font-weight:400;color:#777;font-size:12px}
.listening #d{animation:pulse 1.1s infinite}.processing #d{animation:spin .8s linear infinite;border-radius:2px}
.error #d{background:#d33}.done #d{background:#2a9d4a}
@keyframes pulse{50%{transform:scale(1.5);opacity:.5}}@keyframes spin{to{transform:rotate(360deg)}}
</style><div id="p"><i id="d"></i><div><span id="t"></span><small id="s"></small></div></div>
<script src="indicator.js"></script>
