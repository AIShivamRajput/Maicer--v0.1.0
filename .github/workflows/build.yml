name: Build Maicer installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Security and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match release tag to package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
          if ($tagVersion -ne $packageVersion) {
            throw "Release tag v$tagVersion does not match package.json version $packageVersion."
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in 'install.ps1', 'installer/remove-launcher.ps1') {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "$file has PowerShell parse errors: $($errors -join '; ')" }
          }

  build:
    name: Build Windows installer
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Download verified engines, models, and runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $cfg = Get-Content build/engine-sources.json -Raw | ConvertFrom-Json
          New-Item -ItemType Directory -Force tmp, resources/engine/whisper, resources/engine/llama, resources/engine/models | Out-Null

          function Assert-Sha256([string]$file, [string]$expected, [string]$label) {
            if ([string]::IsNullOrWhiteSpace($expected)) {
              $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
              throw "No authenticated SHA-256 is recorded for $label. Downloaded SHA-256: $actual. Verify it against an upstream-published checksum before updating build/engine-sources.json."
            }
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($actual -ne $expected.ToLower()) {
              throw "SHA-256 mismatch for $label. Expected $expected, got $actual. The file was not used."
            }
            Write-Host "Verified $label SHA-256: $actual"
          }

          $wTag = @(); if ($cfg.whisper.tag) { $wTag = @($cfg.whisper.tag) }
          gh release download @wTag --repo $cfg.whisper.repo --pattern $cfg.whisper.asset --dir tmp
          if ($LASTEXITCODE -ne 0) { throw "whisper.cpp download failed: $($cfg.whisper.asset) not found in $($cfg.whisper.repo)" }
          Assert-Sha256 "tmp/$($cfg.whisper.asset)" $cfg.whisper.sha256 'whisper.cpp'

          git clone --depth 1 --branch $cfg.llama.tag --single-branch "https://github.com/$($cfg.llama.repo).git" tmp/llama-src
          if ($LASTEXITCODE -ne 0) { throw "llama.cpp source checkout failed for tag $($cfg.llama.tag)" }
          $llamaCommit = (git -C tmp/llama-src rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $llamaCommit -ne $cfg.llama.sourceCommit) {
            throw "llama.cpp tag resolved to $llamaCommit, not the pinned source commit $($cfg.llama.sourceCommit)."
          }

          Expand-Archive "tmp/$($cfg.whisper.asset)" tmp/w -Force
          Get-ChildItem tmp/w -Recurse -File -Include *.exe,*.dll | Copy-Item -Destination resources/engine/whisper

          cmake -S tmp/llama-src -B tmp/llama-build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON
          if ($LASTEXITCODE -ne 0) { throw 'llama.cpp CMake configuration failed' }
          cmake --build tmp/llama-build --config Release --target llama-server --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'llama-server build failed' }
          $llamaServer = Get-ChildItem tmp/llama-build -Recurse -File -Filter llama-server.exe | Select-Object -First 1
          if (-not $llamaServer) { throw 'llama-server.exe was not produced by the pinned llama.cpp source build' }
          Copy-Item $llamaServer.FullName resources/engine/llama
          Get-ChildItem $llamaServer.DirectoryName -File -Filter '*.dll' | Copy-Item -Destination resources/engine/llama

          Invoke-WebRequest $cfg.speechModel.url -OutFile resources/engine/models/speech.bin
          Assert-Sha256 resources/engine/models/speech.bin $cfg.speechModel.sha256 'speech model'
          Invoke-WebRequest $cfg.writerModel.url -OutFile resources/engine/models/writer.gguf
          Assert-Sha256 resources/engine/models/writer.gguf $cfg.writerModel.sha256 'writer model'
          Invoke-WebRequest $cfg.vcRedist.url -OutFile resources/vc_redist.x64.exe
          Assert-Sha256 resources/vc_redist.x64.exe $cfg.vcRedist.sha256 'Visual C++ runtime'
          $signature = Get-AuthenticodeSignature resources/vc_redist.x64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
            throw 'The Visual C++ runtime does not have a valid Microsoft code signature.'
          }

          foreach ($file in 'whisper/whisper-cli.exe', 'llama/llama-server.exe', 'models/speech.bin', 'models/writer.gguf') {
            if (-not (Test-Path "resources/engine/$file")) { throw "Missing $file - the upstream release layout may have changed" }
          }
          $modelManifest = "[models]`r`nspeech=$($cfg.speechModel.sha256)`r`nwriter=$($cfg.writerModel.sha256)`r`n"
          [IO.File]::WriteAllText('resources/engine/models/manifest.ini', $modelManifest, [Text.Encoding]::ASCII)
          Get-ChildItem resources/engine -Recurse -File | Select-Object FullName, Length

      - name: Check engine binaries start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & resources/engine/whisper/whisper-cli.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'whisper-cli.exe --help failed' }
          & resources/engine/llama/llama-server.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'llama-server.exe --version failed' }

      - name: Load Whisper model and run llama.cpp inference
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cfg = Get-Content build/engine-sources.json -Raw | ConvertFrom-Json
          $whisper = (Resolve-Path 'resources/engine/whisper/whisper-cli.exe').Path
          $speechModel = (Resolve-Path 'resources/engine/models/speech.bin').Path
          $wavPath = Join-Path $env:RUNNER_TEMP 'whisper-jfk.wav'
          Invoke-WebRequest -Uri $cfg.whisperTestAudio.url -OutFile $wavPath -TimeoutSec 60
          $audioHash = (Get-FileHash $wavPath -Algorithm SHA256).Hash.ToLower()
          if ($audioHash -ne $cfg.whisperTestAudio.sha256) {
            throw "Whisper test audio SHA-256 mismatch: expected $($cfg.whisperTestAudio.sha256), got $audioHash."
          }

          foreach ($launch in 1..2) {
            $whisperLog = Join-Path $env:RUNNER_TEMP "whisper-$launch.log"
            & $whisper -m $speechModel -f $wavPath -l en -nt -np -t 2 *> $whisperLog
            if ($LASTEXITCODE -ne 0) { throw "whisper.cpp failed to load and process the real speech model on launch $launch." }
            $transcript = Get-Content $whisperLog -Raw
            if ($transcript -notmatch '(?i)ask not what your country can do for you' -or
                $transcript -notmatch '(?i)ask what you can do for your country') {
              throw "Whisper did not recognize the pinned JFK speech fixture on launch $launch."
            }
          }

          $server = (Resolve-Path 'resources/engine/llama/llama-server.exe').Path
          $model = (Resolve-Path 'resources/engine/models/writer.gguf').Path
          foreach ($launch in 1..2) {
            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
            $listener.Start()
            $port = ([Net.IPEndPoint]$listener.LocalEndpoint).Port
            $listener.Stop()
            $stdout = Join-Path $env:RUNNER_TEMP "llama-$launch.out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "llama-$launch.err.log"
            $process = Start-Process -FilePath $server -ArgumentList @(
              '-m', "`"$model`"", '--host', '127.0.0.1', '--port', "$port", '-c', '512', '-t', '2', '-np', '1'
            ) -WorkingDirectory (Split-Path $server) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              $ready = $false
              for ($attempt = 0; $attempt -lt 240; $attempt++) {
                $process.Refresh()
                if ($process.HasExited) { throw "llama-server exited during startup on launch $launch." }
                try {
                  $health = Invoke-WebRequest -Uri "http://127.0.0.1:$port/health" -UseBasicParsing -TimeoutSec 3
                  if ($health.StatusCode -eq 200) { $ready = $true; break }
                }
                catch {}
                Start-Sleep -Seconds 1
              }
              if (-not $ready) { throw "llama-server did not load the real writer model on launch $launch." }

              $request = @{
                messages = @(@{ role = 'user'; content = 'Reply with exactly MAICER_ENGINE_OK and nothing else.' })
                temperature = 0
                max_tokens = 32
                stream = $false
              } | ConvertTo-Json -Depth 5
              $response = Invoke-RestMethod -Uri "http://127.0.0.1:$port/v1/chat/completions" -Method Post `
                -ContentType 'application/json' -Body $request -TimeoutSec 120
              if ($response.choices[0].message.content -notmatch 'MAICER_ENGINE_OK') {
                throw "llama.cpp inference returned an unexpected response on launch $launch."
              }
            }
            finally {
              $process.Refresh()
              if (-not $process.HasExited) {
                $process.Kill()
                [void]$process.WaitForExit(10000)
              }
            }
          }

      - run: npm ci
        env:
          npm_config_msvs_version: 2022
      - run: npm run dist
      - name: Verify installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist -Filter '*.exe' -File -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)." }
          if ($installers[0].Length -le 0) { throw "Installer is empty: $($installers[0].FullName)" }
          Write-Host "Verified installer: $($installers[0].FullName) ($($installers[0].Length) bytes)"

      - name: Install package and verify installed app, models, and shortcut
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path (Get-ChildItem dist -Filter '*.exe' -File | Select-Object -First 1).FullName).Path
          $setup = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Silent installer exited with code $($setup.ExitCode)." }

          $app = Join-Path $env:LOCALAPPDATA 'Programs\Maicer\Maicer.exe'
          $engine = Join-Path $env:LOCALAPPDATA 'Programs\Maicer\resources\engine'
          $models = Join-Path $env:LOCALAPPDATA 'Maicer\engine\models'
          foreach ($file in @(
            $app,
            (Join-Path $engine 'whisper\whisper-cli.exe'),
            (Join-Path $engine 'llama\llama-server.exe'),
            (Join-Path $models 'speech.bin'),
            (Join-Path $models 'writer.gguf'),
            (Join-Path $models 'manifest.ini')
          )) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Installed package is missing $file." }
          }

          $shortcuts = @(Get-ChildItem (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs') -Recurse -Filter 'Maicer.lnk' -File)
          if ($shortcuts.Count -eq 0) { throw 'The Maicer Start Menu shortcut was not installed.' }

          $appProcess = Start-Process -FilePath $app -ArgumentList '--disable-gpu' -PassThru
          Start-Sleep -Seconds 15
          $appProcess.Refresh()
          if ($appProcess.HasExited) { throw "Installed Maicer exited during launch with code $($appProcess.ExitCode)." }
          $appProcess.Kill()
          [void]$appProcess.WaitForExit(10000)

      - uses: actions/upload-artifact@v4
        with:
          name: Maicer-Setup
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [checks, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Maicer-Setup
          path: dist
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected exactly one installer, found $($installers.Count)." }
          if ($installers[0].Length -le 0) { throw "Installer is empty: $($installers[0].FullName)" }
          $version = $env:GITHUB_REF_NAME
          $target = "dist/Maicer-Setup-$version.exe"
          Copy-Item $installers[0].FullName $target
          $checksum = "$target.sha256"
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText($checksum, "$hash  $(Split-Path -Leaf $target)`n", [Text.Encoding]::ASCII)
          gh release create $version $target $checksum --title "Maicer $version" --generate-notes --verify-tag
